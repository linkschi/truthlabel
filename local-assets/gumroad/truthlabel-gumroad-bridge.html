<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Truthlabel Access</title>
    <style>
      :root {
        color-scheme: light;
        --green: #0e5a3f;
        --green-bright: #15803d;
        --green-soft: #e8f6ef;
        --yellow: #f5c542;
        --red: #e64b4f;
        --ink: #171412;
        --muted: #625b52;
        --line: #e4ddd3;
        --cream: #f8f7f2;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 16% 12%, rgba(21, 128, 61, 0.12), transparent 18rem),
          radial-gradient(circle at 88% 72%, rgba(245, 197, 66, 0.18), transparent 19rem),
          linear-gradient(180deg, var(--cream), #f1eee7);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 28px 18px;
      }

      .card {
        width: min(100%, 560px);
        overflow: hidden;
        border: 1px solid rgba(228, 221, 211, 0.95);
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 28px 80px rgba(23, 20, 18, 0.12);
      }

      .hero {
        position: relative;
        padding: 34px 26px 24px;
      }

      .hero::after {
        position: absolute;
        right: -42px;
        top: -48px;
        width: 150px;
        height: 150px;
        border: 26px solid rgba(21, 128, 61, 0.08);
        border-radius: 999px;
        content: "";
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .mark {
        display: inline-flex;
        width: 42px;
        height: 42px;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: var(--green);
        box-shadow: 0 12px 26px rgba(14, 90, 63, 0.24);
      }

      .mark span {
        display: grid;
        gap: 4px;
      }

      .mark i {
        display: block;
        width: 22px;
        height: 4px;
        border-radius: 999px;
      }

      .mark i:nth-child(1) {
        background: var(--red);
      }

      .mark i:nth-child(2) {
        background: var(--yellow);
      }

      .mark i:nth-child(3) {
        background: #32a66a;
      }

      .eyebrow {
        margin: 30px 0 0;
        color: var(--green-bright);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 440px;
        margin: 10px 0 0;
        font-size: clamp(38px, 9vw, 58px);
        line-height: 0.94;
        letter-spacing: -0.065em;
      }

      .copy {
        max-width: 460px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 16px;
        font-weight: 600;
        line-height: 1.65;
      }

      .actions {
        display: grid;
        gap: 12px;
        padding: 0 26px 28px;
      }

      .button {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 14px 20px;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
      }

      .button-primary {
        background: linear-gradient(115deg, var(--green-bright), var(--green));
        color: var(--white);
        box-shadow: 0 18px 42px rgba(21, 128, 61, 0.24);
      }

      .button-secondary {
        border-color: var(--line);
        background: var(--white);
        color: var(--green);
      }

      .note {
        margin: 0;
        border-top: 1px solid var(--line);
        background: var(--green-soft);
        padding: 16px 22px;
        color: var(--green);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.55;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="truthlabel-access-title">
        <div class="hero">
          <div class="logo" aria-label="Truthlabel">
            <span class="mark" aria-hidden="true">
              <span>
                <i></i>
                <i></i>
                <i></i>
              </span>
            </span>
            <span>Truthlabel</span>
          </div>

          <p class="eyebrow">Truthlabel access</p>
          <h1 id="truthlabel-access-title">You are in the right place.</h1>
          <p class="copy">
            Continue to checkout to start your Truthlabel trial, or return to
            the main Truthlabel website if you landed here by mistake.
          </p>
        </div>

        <div class="actions">
          <a
            class="button button-primary"
            href="https://truthlabel.gumroad.com/l/fnoakd?wanted=true"
            data-gumroad-action="buy"
          >
            Continue to checkout
          </a>
          <a class="button button-secondary" href="https://truthlabel.vercel.app/">
            Back to Truthlabel home
          </a>
        </div>

        <p class="note">
          Trial details and current price are confirmed at checkout.
        </p>
      </section>
    </main>
  </body>
</html>
