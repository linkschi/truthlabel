<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E4C37" />
    <title>Truthlabel - Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f7f2;
        color: #171412;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        border: 1px solid #e4ddd3;
        border-radius: 24px;
        background: #fff;
        padding: 28px;
        box-shadow: 0 18px 38px rgba(23, 20, 18, 0.08);
      }
      .mark { display: flex; gap: 8px; }
      .mark span { width: 12px; height: 12px; border-radius: 999px; }
      h1 { margin: 20px 0 8px; font-size: 26px; }
      p { margin: 0; color: #625b52; font-size: 15px; line-height: 1.55; }
      .note { margin-top: 12px; font-size: 13px; }
      .actions { display: grid; gap: 10px; margin-top: 22px; }
      button, a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
      button { border: 0; background: #0e5a3f; color: #fff; }
      a { border: 1px solid #d7e7dd; color: #0e5a3f; background: #f3faf6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <span style="background:#c81e1e"></span>
        <span style="background:#f59e0b"></span>
        <span style="background:#16a34a"></span>
      </div>
      <h1>You are offline</h1>
      <p>Truthlabel needs an internet connection for product and official safety lookups.</p>
      <p class="note">Missing live data is not treated as proof that a product has no warnings.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Try again</button>
        <a href="/">Return home</a>
      </div>
    </main>
  </body>
</html>
